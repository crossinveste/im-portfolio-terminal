function sha256Bytes(msgBytes) {
  const len = msgBytes.length;
  const bitLenHi = Math.floor((len * 8) / 0x100000000);
  const bitLenLo = (len * 8) >>> 0;
  const padLen = ((len + 9 + 63) & ~63);
  const buf = new Uint8Array(padLen);
  buf.set(msgBytes);
  buf[len] = 0x80;
  const dv = new DataView(buf.buffer);
  dv.setUint32(padLen - 8, bitLenHi, false);
  dv.setUint32(padLen - 4, bitLenLo, false);

  let h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a;
  let h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19;
  const w = new Uint32Array(64);

  for (let off = 0; off < padLen; off += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(off + i * 4, false);
    for (let i = 16; i < 64; i++) {
      const x = w[i - 15], y = w[i - 2];
      const s0 = ((x >>> 7) | (x << 25)) ^ ((x >>> 18) | (x << 14)) ^ (x >>> 3);
      const s1 = ((y >>> 17) | (y << 15)) ^ ((y >>> 19) | (y << 13)) ^ (y >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
    }
    let a = h0, b = h1, c = h2, d = h3, e = h4, f = h5, g = h6, h = h7;
    for (let i = 0; i < 64; i++) {
      const S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + K256[i] + w[i]) >>> 0;
      const S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
      const maj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + maj) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0;
      d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    h0 = (h0 + a) >>> 0; h1 = (h1 + b) >>> 0; h2 = (h2 + c) >>> 0; h3 = (h3 + d) >>> 0;
    h4 = (h4 + e) >>> 0; h5 = (h5 + f) >>> 0; h6 = (h6 + g) >>> 0; h7 = (h7 + h) >>> 0;
  }
  const out = new Uint8Array(32);
  const odv = new DataView(out.buffer);
  odv.setUint32(0, h0, false); odv.setUint32(4, h1, false); odv.setUint32(8, h2, false); odv.setUint32(12, h3, false);
  odv.setUint32(16, h4, false); odv.setUint32(20, h5, false); odv.setUint32(24, h6, false); odv.setUint32(28, h7, false);
  return out;
}

function hmacSha256(keyBytes, dataBytes) {
  let k = keyBytes;
  if (k.length > 64) k = sha256Bytes(k);
  const ipad = new Uint8Array(64), opad = new Uint8Array(64);
  ipad.fill(0x36); opad.fill(0x5c);
  for (let i = 0; i < k.length; i++) { ipad[i] ^= k[i]; opad[i] ^= k[i]; }
  const inner = new Uint8Array(64 + dataBytes.length);
  inner.set(ipad, 0); inner.set(dataBytes, 64);
  const ih = sha256Bytes(inner);
  const outer = new Uint8Array(64 + 32);
  outer.set(opad, 0); outer.set(ih, 64);
  return sha256Bytes(outer);
}

async function deriveVaultKeys(passkey, saltBytes, iterations) {
  const pwBytes = new TextEncoder().encode(passkey);
  if (typeof crypto !== 'undefined' && crypto.subtle && typeof crypto.subtle.importKey === 'function') {
    try {
      const baseKey = await crypto.subtle.importKey('raw', pwBytes, 'PBKDF2', false, ['deriveBits']);
      const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: saltBytes, iterations, hash: 'SHA-256' }, baseKey, 512);
      const dk = new Uint8Array(bits);
      return { encKey: dk.slice(0, 32), macKey: dk.slice(32, 64) };
    } catch (_) {}
  }
  // Pure-JS RFC 2898 PBKDF2-HMAC-SHA256 fallback (for file:// Safari or CLI test)
  const dk = new Uint8Array(64);
  for (let blockIdx = 1; blockIdx <= 2; blockIdx++) {
    const saltInt = new Uint8Array(saltBytes.length + 4);
    saltInt.set(saltBytes, 0);
    new DataView(saltInt.buffer).setUint32(saltBytes.length, blockIdx, false);
    let u = hmacSha256(pwBytes, saltInt);
    const t = new Uint8Array(u);
    for (let c = 1; c < iterations; c++) {
      u = hmacSha256(pwBytes, u);
      for (let j = 0; j < 32; j++) t[j] ^= u[j];
    }
    dk.set(t, (blockIdx - 1) * 32);
  }
  return { encKey: dk.slice(0, 32), macKey: dk.slice(32, 64) };
}

function b64ToBytes(b64) {
  const raw = Array.isArray(b64) ? b64.join('') : String(b64 || '');
  const bin = atob(raw.replace(/\s+/g, ''));
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function bytesToB64(bytes) {
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  return btoa(bin);
}

function randomBytes(n) {
  const b = new Uint8Array(n);
  if (typeof crypto !== 'undefined' && typeof crypto.getRandomValues === 'function') {
    crypto.getRandomValues(b);
  } else {
    for (let i = 0; i < n; i++) b[i] = Math.floor(Math.random() * 256);
  }
  return b;
}

function xorKeystream(inputBytes, encKey, iv) {
  const out = new Uint8Array(inputBytes.length);
  const buf = new Uint8Array(32 + 16 + 4);
  buf.set(encKey, 0);
  buf.set(iv, 32);
  const dv = new DataView(buf.buffer);
  const blocks = Math.ceil(inputBytes.length / 32);
  for (let i = 0; i < blocks; i++) {
    dv.setUint32(48, i, false);
    const ks = sha256Bytes(buf);
    const start = i * 32;
    const end = Math.min(start + 32, inputBytes.length);
    for (let j = 0; j < end - start; j++) out[start + j] = inputBytes[start + j] ^ ks[j];
  }
  return out;
}

async function unsealPayload(envelope, passkey) {
  if (!envelope || !envelope.sealed) return envelope;
  const salt = b64ToBytes(envelope.salt);
  const iv = b64ToBytes(envelope.iv);
  const mac = b64ToBytes(envelope.mac);
  const ct = b64ToBytes(envelope.ct);
  const iter = Number(envelope.iter || 100000);
  const { encKey, macKey } = await deriveVaultKeys(passkey, salt, iter);

  const macInput = new Uint8Array(salt.length + iv.length + ct.length);
  macInput.set(salt, 0);
  macInput.set(iv, salt.length);
  macInput.set(ct, salt.length + iv.length);
  const expectedMac = hmacSha256(macKey, macInput);
  if (expectedMac.length !== mac.length) throw new Error('Invalid passkey');
  let diff = 0;
  for (let i = 0; i < mac.length; i++) diff |= (expectedMac[i] ^ mac[i]);
  if (diff !== 0) throw new Error('Invalid passkey');

  const ptBytes = xorKeystream(ct, encKey, iv);
  const jsonText = envelope.comp === 'deflate-raw'
    ? await inflateRawBytes(ptBytes)
    : new TextDecoder('utf-8').decode(ptBytes);
  return JSON.parse(jsonText);
}

async function deflateRawBytes(uint8) {
  if (typeof CompressionStream !== 'function') return null;
  try {
    const cs = new CompressionStream('deflate-raw');
    const readProm = new Response(cs.readable).arrayBuffer();
    const writer = cs.writable.getWriter();
    await writer.write(uint8);
    await writer.close();
    return new Uint8Array(await readProm);
  } catch (_) {
    return null;
  }
}

async function sealPayload(dataObj, passkey) {
  const versionId = (dataObj && dataObj.meta && dataObj.meta.version_id) ? String(dataObj.meta.version_id) : String(Date.now());
  const rawBytes = new TextEncoder().encode(JSON.stringify(dataObj));
  const compBytes = await deflateRawBytes(rawBytes);
  const payloadBytes = compBytes || rawBytes;
  const salt = randomBytes(16);
  const iv = randomBytes(16);
  const iter = 100000;
  const { encKey, macKey } = await deriveVaultKeys(passkey, salt, iter);
  const ct = xorKeystream(payloadBytes, encKey, iv);

  const macInput = new Uint8Array(salt.length + iv.length + ct.length);
  macInput.set(salt, 0);
  macInput.set(iv, salt.length);
  macInput.set(ct, salt.length + iv.length);
  const mac = hmacSha256(macKey, macInput);

  const ctB64 = bytesToB64(ct);
  const ctLines = [];
  for (let i = 0; i < ctB64.length; i += 64) ctLines.push(ctB64.slice(i, i + 64));

  const env = {
    sealed: true,
    v: compBytes ? 2 : 1,
    kdf: 'PBKDF2-HMAC-SHA256',
    iter,
    version_id: versionId,
    salt: bytesToB64(salt),
    iv: bytesToB64(iv),
    mac: bytesToB64(mac),
    ct: ctLines
  };
  if (compBytes) env.comp = 'deflate-raw';
  return env;
}

function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

const hasNum = (v) => v !== null && v !== undefined && v !== '' && !Number.isNaN(Number(v));

const parseOptPct = (v) => {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') return Number.isNaN(v) ? null : v;
  const s = String(v).trim();
  if (!s || s === '—' || s === '-') return null;
  if (s.endsWith('%')) {
    const n = parseFloat(s.slice(0, -1));
    return Number.isNaN(n) ? null : n / 100.0;
  }
  const n = parseFloat(s);
  return Number.isNaN(n) ? null : n;
};

const fmtPct = (v, dec = 2, signed = false) => {
  if (!hasNum(v)) return '—';
  const n = Number(v) * 100;
  const s = n.toFixed(dec) + '%';
  return (signed && n > 0) ? '+' + s : s;
};
const fmtBps = (v) => {
  if (!hasNum(v)) return '—';
  const bps = Math.round(Number(v) * 10000);
  return (bps > 0 ? '+' : '') + bps + ' bps';
};
const fmtNum = (v, dec = 2) => {
  if (!hasNum(v)) return '—';
  return Number(v).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
};
const colorCls = (v) => {

  const map = {};
  AC_ORDER.forEach(k => map[k] = 0);
  mandate.positions.forEach((p, idx) => {
    const ac = AC_ORDER.includes(p.ac) ? p.ac : 'Cash';
    const tr = includeTrades ? (STATE.trades[mandate.id + ':' + idx] || 0) : 0;
    map[ac] += (Number(p.w) || 0) + tr;

async function pollLiveSnapshot(isManual = false) {
  if (!STATE.unlocked || !STATE.passkey || typeof fetch !== 'function') return;
  const savedTok = getSavedToken();
  if (savedTok || !STATE.repoApiPrivate) {
    const apiUrl = `https://api.github.com/repos/${GH_CONFIG.owner}/${GH_CONFIG.repo}/contents/${GH_CONFIG.path}?ref=${GH_CONFIG.branch}`;
    const headers = {};
    if (STATE.lastEtag && !isManual) headers['If-None-Match'] = STATE.lastEtag;
    if (savedTok) headers['Authorization'] = 'Bearer ' + savedTok;

    try {
      let res = await fetch(apiUrl, { headers, cache: 'no-cache' });
      if (res.status === 401 && headers['Authorization']) {
        delete headers['Authorization'];
        res = await fetch(apiUrl, { headers, cache: 'no-cache' });
      }
      if ((res.status === 404 || res.status === 403) && !savedTok) {
        STATE.repoApiPrivate = true;
      } else {
        STATE.lastChecked = sgtNowStr();
        if (res.status === 304) {
          if (STATE.cloudStatus !== 'live') { STATE.cloudStatus = 'live'; if (!STATE.syncModalOpen) render(); }
          return;
        }
        if (res.ok) {
          const etag = res.headers.get('ETag');
          if (etag) STATE.lastEtag = etag;
          const payload = await res.json();
          const wasConnected = Boolean(STATE.lastSha);
          if (payload && payload.sha && payload.content) {
            const prevVersion = STATE.data && STATE.data.meta ? STATE.data.meta.version_id : '';
            STATE.lastSha = payload.sha;
            const rawEnvelope = JSON.parse(base64ToUtf8(payload.content));
            const envVersion = rawEnvelope.version_id || (rawEnvelope.meta ? rawEnvelope.meta.version_id : '');
            STATE.cloudStatus = 'live';
            if (envVersion !== prevVersion) {
              const remoteData = rawEnvelope.sealed ? await unsealPayload(rawEnvelope, STATE.passkey) : rawEnvelope;
              if (remoteData && Array.isArray(remoteData.mandates)) {
                STATE.data = remoteData;
                if (!STATE.expandedLt && remoteData.top10 && remoteData.top10[0]) STATE.expandedLt = remoteData.top10[0].name;
                if (!STATE.syncModalOpen) render();
                if (wasConnected || isManual) {
                  showLiveToast('Live update received — ' + (remoteData.meta.locked_at || remoteData.meta.as_of_date));
                }
                return;
              }
            }
          }
          if (STATE.cloudStatus !== 'live') { STATE.cloudStatus = 'live'; if (!STATE.syncModalOpen) render(); }
          if (isManual) showLiveToast('Already up to date (' + (STATE.data.meta.as_of_date || 'Latest') + ')');
          return;
        }
      }
    } catch (_) {}
  }

  const fallbackUrls = [`data/snapshot.json?t=${Date.now()}`, `${GH_CONFIG.liveUrl}${GH_CONFIG.path}?t=${Date.now()}`];
  for (const cdnUrl of fallbackUrls) {
    try {
      const res2 = await fetch(cdnUrl, { cache: 'no-store' });
      if (res2.ok) {
        STATE.lastChecked = sgtNowStr();
        const rawEnvelope = await res2.json();
        const prevVersion = STATE.data && STATE.data.meta ? STATE.data.meta.version_id : '';
        const envVersion = rawEnvelope.version_id || (rawEnvelope.meta ? rawEnvelope.meta.version_id : '');
        const wasLive = STATE.cloudStatus === 'live';
        STATE.cloudStatus = 'live';
        if (envVersion !== prevVersion) {
          const remoteData = rawEnvelope.sealed ? await unsealPayload(rawEnvelope, STATE.passkey) : rawEnvelope;
          if (remoteData && Array.isArray(remoteData.mandates)) {
            STATE.data = remoteData;
            if (!STATE.expandedLt && remoteData.top10 && remoteData.top10[0]) STATE.expandedLt = remoteData.top10[0].name;
            if (!STATE.syncModalOpen) render();
            showLiveToast('Live update received — ' + (remoteData.meta.locked_at || remoteData.meta.as_of_date));
            return;
          }
        }
        if (!wasLive && !STATE.syncModalOpen) render();
        if (isManual) showLiveToast('Already up to date (' + (STATE.data.meta.as_of_date || 'Latest') + ')');
        return;
      }
    } catch (_) {}
  }
  if (STATE.cloudStatus === 'connecting') {
    STATE.cloudStatus = 'offline';
    if (!STATE.syncModalOpen) render();
  }
}

async function publishBranchFile(token, branch, contentB64, commitMsg) {
  const url = `https://api.github.com/repos/${GH_CONFIG.owner}/${GH_CONFIG.repo}/contents/${GH_CONFIG.path}`;
  let sha = undefined;
  const getRes = await fetch(`${url}?ref=${branch}&t=${Date.now()}`, {
    headers: { 'Authorization': 'Bearer ' + token },
    cache: 'no-store'
  });
  if (getRes.ok) {
    const cur = await getRes.json();
    sha = cur.sha;
  } else if (getRes.status === 401 || getRes.status === 403) {
    throw new Error('GitHub token rejected (check Fine-Grained PAT has Contents: Read & Write on im-portfolio-terminal, or regenerate if expired).');
  }
  const body = { message: commitMsg, content: contentB64, branch };
  if (sha) body.sha = sha;
  const putRes = await fetch(url, {
    method: 'PUT',
    headers: {
      'Authorization': 'Bearer ' + token,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(body)
  });
  if (!putRes.ok) {
    const errTxt = await putRes.text();
    throw new Error(`GitHub publish failed (${putRes.status}): ${errTxt.slice(0, 140)}`);
  }
  return await putRes.json();
}

async function publishSnapshotToGitHub(rawToken, sourceLabel = 'Manual Publish') {
  const token = String(rawToken || getSavedToken() || '').trim();
  if (!token) {
    STATE.syncTone = 'warn';
    STATE.syncStatus = 'Paste your one-time GitHub Publisher Token above to broadcast live to everyone.';
    STATE.pendingPublish = true;
    render();
    return false;
  }
  try {
    STATE.syncTone = 'info';
    STATE.syncStatus = 'Publishing sanitized snapshot live to GitHub for all viewers...';
    render();

    STATE.data.meta.version_id = String(Date.now());
    STATE.data.meta.locked_at = sgtNowStr() + ' (' + sourceLabel + ')';
    const sealedEnv = await sealPayload(STATE.data, STATE.passkey);
    const jsonStr = JSON.stringify(sealedEnv);
    const b64 = utf8ToBase64(jsonStr);
    const msg = `Live IM snapshot update: ${STATE.data.meta.as_of_date} (${sourceLabel})`;

    const resData = await publishBranchFile(token, GH_CONFIG.branch, b64, msg);
    setSavedToken(token);
    if (resData && resData.content && resData.content.sha) {
      STATE.lastSha = resData.content.sha;

    }
    publishBranchFile(token, 'main', b64, msg).catch(() => {});

    STATE.cloudStatus = 'live';
    STATE.pendingPublish = false;
    STATE.locked = true;
    STATE.syncTone = 'ok';
    STATE.syncStatus = 'Published LIVE! Everyone on the link will see this update automatically within seconds.';
    render();
    setTimeout(() => {
      STATE.syncModalOpen = false;
      STATE.syncStatus = '';
      showLiveToast('Published live to all viewers — ' + STATE.data.meta.as_of_date);
    }, 1300);
    return true;
  } catch (err) {
    STATE.syncTone = 'err';
    STATE.syncStatus = err.message;
    STATE.pendingPublish = true;
    render();
    return false;
  }
}

async function inflateRawBytes(uint8) {
  const ds = new DecompressionStream('deflate-raw');
  const readProm = new Response(ds.readable).arrayBuffer();
  const writer = ds.writable.getWriter();
  await writer.write(uint8);
  await writer.close();
  const buf = await readProm;
  return new TextDecoder('utf-8').decode(buf);
}

async function readXlsxEntries(arrayBuffer) {
  const bytes = new Uint8Array(arrayBuffer);
  const view = new DataView(arrayBuffer);
  let eocd = -1;
  for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--) {
    if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('Not a valid .xlsx ZIP archive.');
  const cdCount = view.getUint16(eocd + 10, true);
  const cdOffset = view.getUint32(eocd + 16, true);
  let ptr = cdOffset;
  const files = {};
  const dec = new TextDecoder('utf-8');
  for (let i = 0; i < cdCount; i++) {
    if (view.getUint32(ptr, true) !== 0x02014b50) break;
    const method = view.getUint16(ptr + 10, true);
    const compSize = view.getUint32(ptr + 20, true);
    const nameLen = view.getUint16(ptr + 28, true);
    const extraLen = view.getUint16(ptr + 30, true);
    const commentLen = view.getUint16(ptr + 32, true);
    const localOff = view.getUint32(ptr + 42, true);
    const name = dec.decode(bytes.subarray(ptr + 46, ptr + 46 + nameLen));
    ptr += 46 + nameLen + extraLen + commentLen;
    if (name.endsWith('.xml') || name.endsWith('.rels')) {
      if (name.startsWith('xl/externalLinks/')) continue;
      const lNameLen = view.getUint16(localOff + 26, true);
      const lExtraLen = view.getUint16(localOff + 28, true);
      const dataStart = localOff + 30 + lNameLen + lExtraLen;
      const slice = bytes.subarray(dataStart, dataStart + compSize);
      files[name] = method === 0 ? dec.decode(slice) : await inflateRawBytes(slice);
    }
  }
  return files;
}

function parseSheetCells(xmlStr, sharedStrings) {
  const doc = new DOMParser().parseFromString(xmlStr, 'application/xml');
  const cells = {};
  const cNodes = doc.getElementsByTagName('c');
  for (let i = 0; i < cNodes.length; i++) {
    const c = cNodes[i];
    const ref = c.getAttribute('r');
    const t = c.getAttribute('t');
    if (t === 'e') continue;
    const vNode = c.getElementsByTagName('v')[0];
    const isNode = c.getElementsByTagName('is')[0];
    let val = null;
    if (t === 's' && vNode) val = sharedStrings[parseInt(vNode.textContent, 10)] ?? '';
    else if (t === 'inlineStr' && isNode) val = isNode.textContent;
    else if (t === 'str' && vNode) val = vNode.textContent;
    else if (vNode) {
      const num = parseFloat(vNode.textContent);
      val = Number.isNaN(num) ? vNode.textContent : num;
    }
    if (ref && val !== null) cells[ref] = val;
  }
  return cells;
}

function colLtr(n) {
  let s = '';
  while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); }
  return s;
}
function excelDateStr(v) {
  if (typeof v === 'number' && v > 30000 && v < 70000) {
    const d = new Date(Math.round((v - 25569) * 86400 * 1000));
    return d.toISOString().slice(0, 10);
  }
  return v ? String(v).trim() : '';
}

function syncWorkbookSheets(sheetMap) {
  let updatedCount = 0;
  if (sheetMap['1_BBG_Hub'] && sheetMap['2_Holdings_Ledger']) {
    const hub = sheetMap['1_BBG_Hub'];
    const led = sheetMap['2_Holdings_Ledger'];
    const dash = sheetMap['5_Dashboard'] || {};
    const fcn = sheetMap['3_FCN_Tracker'] || {};
    const lt = sheetMap['4_Lookthrough_Exposure'] || {};

    if (hub['D2']) STATE.data.meta.as_of_date = excelDateStr(hub['D2']);
    if (typeof hub['J6'] === 'number') STATE.data.macro.acwi_ytd = hub['J6'];
    if (typeof hub['K6'] === 'number') STATE.data.macro.acwi_1d = hub['K6'];
    if (typeof hub['J7'] === 'number') STATE.data.macro.spx_ytd = hub['J7'];
    if (typeof hub['K7'] === 'number') STATE.data.macro.spx_sharpe_ytd = hub['K7'];
    if (typeof hub['J8'] === 'number') STATE.data.macro.acwi_vol_ytd = hub['J8'];
    if (typeof hub['K8'] === 'number') STATE.data.macro.acwi_sharpe_ytd = hub['K8'];
    for (let idx = 0; idx < 5; idx++) {
      const vr = 16 + idx;
      if (typeof hub['J' + vr] === 'number' && STATE.data.vol[idx]) {
        STATE.data.vol[idx].last = hub['J' + vr];
        if (typeof hub['K' + vr] === 'number') STATE.data.vol[idx].avg_1y = hub['K' + vr];
      }
    }

    const ledByMandate = {};
    const growthPmFallback = {};
    for (let r = 4; r <= 200; r++) {
      const mName = led['A' + r];
      const tk = led['D' + r];
      if (!mName || !tk) continue;
      const pmVal = mName === 'Growth' ? parseOptPct(led['F' + r]) : null;
      if (mName === 'Growth') growthPmFallback[String(tk).toUpperCase()] = pmVal;

      if (typeof led['U' + r] !== 'number') continue;
      if (!ledByMandate[mName]) ledByMandate[mName] = [];
      const entry = {
        name: String(led['O' + r] || led['C' + r] || tk),
        ref_name: String(led['C' + r] || led['O' + r] || tk),
        sector: String(led['B' + r] || ''),
        ticker: String(tk),
        ac: String(led['E' + r] || 'Cash'),
        ccy: String(led['P' + r] || 'USD'),
        w: led['U' + r],
        d1: Number(led['W' + r] || 0),
        d5: Number(led['X' + r] || 0),
        ytd_pos: Number(led['Y' + r] || 0),
        hpr_usd: Number(led['Z' + r] || 0),
        c_ytd: Number(led['AC' + r] || 0),
        vol: Number(led['AE' + r] || 0)
      };
      if (mName === 'Growth') entry.premarket = pmVal;
      ledByMandate[mName].push(entry);
      updatedCount++;
    }

    STATE.data.mandates.forEach((m, mIdx) => {
      if (ledByMandate[m.name] && ledByMandate[m.name].length > 0) {
        m.positions = ledByMandate[m.name];
      } else if (m.name === 'Growth') {
        m.positions.forEach(p => {
          const k = String(p.ticker).toUpperCase();
          if (k in growthPmFallback) {
            p.premarket = growthPmFallback[k];
            if (growthPmFallback[k] !== null) updatedCount++;
          }
        });
      }
      const dr = 5 + mIdx;
      if (typeof dash['E' + dr] === 'number') m.ytd = dash['E' + dr];
      if (typeof dash['F' + dr] === 'number') m.ytd_ex_fcn = dash['F' + dr];
      if (typeof dash['G' + dr] === 'number') m.bm_ytd = dash['G' + dr];
      if (typeof dash['I' + dr] === 'number') m.d1 = dash['I' + dr];
      if (typeof dash['J' + dr] === 'number') m.w1 = dash['J' + dr];
      if (typeof dash['K' + dr] === 'number') m.vol_ytd = dash['K' + dr];
      if (typeof dash['L' + dr] === 'number') m.sharpe_ytd = dash['L' + dr];
    });

    const spxSpot = fcn['C5'] ?? fcn['D5'], nkySpot = fcn['C6'] ?? fcn['D6'], sx5Spot = fcn['C7'] ?? fcn['D7'];
    const parsedFcns = [];
    for (let r = 11; r <= 30; r++) {
      const nid = fcn['A' + r];
      if (!nid || typeof fcn['M' + r] !== 'number') continue;
      const kiPct = Number(fcn['I' + r] || 0.6);
      const uList = [
        { ticker: 'SPX Index', name: 'S&P 500', ref: Number(fcn['M' + r]), last: Number(spxSpot || 0) },
        { ticker: 'NKY Index', name: 'Nikkei 225', ref: Number(fcn['N' + r]), last: Number(nkySpot || 0) },
        { ticker: 'SX5E Index', name: 'Euro Stoxx 50', ref: Number(fcn['O' + r]), last: Number(sx5Spot || 0) }
      ].map(u => ({ ...u, pct_ref: u.last / u.ref, chg: (u.last / u.ref) - 1, ki_buffer: (u.last / u.ref) - kiPct }));
      parsedFcns.push({
        id: String(nid),
        label: String(nid) + ' — Autocall Note',
        mandate: String(fcn['B' + r] || ''),
        issue_date: excelDateStr(fcn['C' + r]),
        next_obs: excelDateStr(fcn['D' + r]),
        days_to_obs: Math.round(Number(fcn['E' + r] || 0)),
        maturity: excelDateStr(fcn['F' + r]),
        port_weight: Number(fcn['G' + r] || 0),
        days_held: Math.round(Number(fcn['H' + r] || 0)),
        ki_barrier_pct: kiPct,
        ki_breach_chg: kiPct - 1,
        ko_barrier_pct: 1.0,
        coupon_ann: Number(fcn['J' + r] || 0),
        accrued_coupon: Number(fcn['K' + r] || 0),
        ytd_contrib: Number(fcn['L' + r] || 0),
        underlyings: uList
      });
    }
    if (parsedFcns.length > 0) { STATE.data.fcns = parsedFcns; updatedCount += parsedFcns.length; }

    const cMap = {}, issMap = {};
    for (let b = 0; b < 20; b++) {
      const c0 = 1 + b * 6;
      const etfTk = lt[colLtr(c0) + '1'];
      const etfPortWt = lt[colLtr(c0 + 2) + '1'];
      if (!etfTk || typeof etfPortWt !== 'number' || etfPortWt <= 0) continue;
      const etfShort = String(etfTk).split(' ')[0];
      for (let r = 2; r <= 51; r++) {
        const hn = lt[colLtr(c0) + r];
        const ht = lt[colLtr(c0 + 1) + r];
        const hw = lt[colLtr(c0 + 2) + r];
        const hc = lt[colLtr(c0 + 3) + r];
        if (!hn || !ht || typeof hw !== 'number' || hw <= 0 || String(hn).startsWith('#')) continue;
        const eff = etfPortWt * (hw / 100.0);
        const key = String(hn).trim();
        if (!cMap[key]) cMap[key] = { n: key, t: String(ht).trim(), c: String(hc || 'OTHER').trim(), w: 0, s: [] };
        cMap[key].w += eff;
        cMap[key].s.push([etfShort, Number((eff * 100).toFixed(3)), Number(hw.toFixed(2))]);

        const ikey = normIssuerKey(key);
        const tkShort = String(ht).split(' ')[0];
        if (!issMap[ikey]) issMap[ikey] = { key: ikey, tickers: new Set(), primaryTicker: String(ht).trim(), country: String(hc || '').trim(), eff_weight: 0, sources: [] };
        issMap[ikey].tickers.add(tkShort);
        issMap[ikey].eff_weight += eff;
        issMap[ikey].sources.push({ etf: etfShort + ' (' + tkShort + ')', eff_weight: eff, etf_pct: hw });
      }
    }
    const newConst = Object.values(cMap).sort((a, b) => b.w - a.w);
    if (newConst.length > 0) {
      STATE.data.constituents = newConst;
      updatedCount += newConst.length;
    }

    const newTop10 = [];
    for (let r = 56; r <= 65; r++) {
      const nm = lt['B' + r], tk = lt['C' + r], exp = lt['D' + r];
      const pmVal = parseOptPct(lt['E' + r]);
      if (!nm || !tk || typeof exp !== 'number') continue;
      const ikey = normIssuerKey(nm);
      const issObj = issMap[ikey];
      const multiClass = issObj && issObj.tickers.size > 1;
      const dispName = multiClass ? (ikey + ' (' + Array.from(issObj.tickers).join(' + ') + ')') : String(nm).trim();
      const dispTk = multiClass ? Array.from(issObj.tickers).join('+') + ' ' + (String(tk).split(' ')[1] || '') : String(tk).trim();
      newTop10.push({
        name: dispName,
        ticker: dispTk.trim(),
        country: issObj ? issObj.country : '',
        exposure: exp,
        sources: issObj ? issObj.sources : [],
        premarket: pmVal,
        d1: Number(lt['F' + r] || 0),
        d5: Number(lt['G' + r] || 0),
        mtd: Number(lt['H' + r] || 0),
        ytd: Number(lt['I' + r] || 0),
        peak_to_today: Number(lt['J' + r] || 0),
        next_earnings: excelDateStr(lt['K' + r]),
        days_to_earnings: Math.round(Number(lt['L' + r] || 0)),
        post_earn_1d: Number(lt['N' + r] || 0),
        post_earn_10d: Number(lt['O' + r] || 0),
        since_last_earn: Number(lt['P' + r] || 0)
      });
    }
    if (newTop10.length > 0) {
      STATE.data.top10 = newTop10;
      if (newTop10[0]) STATE.expandedLt = newTop10[0].name;
    } else {
      for (let i = 0; i < 10; i++) {
        const r = 56 + i;
        if (('E' + r) in lt && STATE.data.top10[i]) {
          const pmVal = parseOptPct(lt['E' + r]);
          STATE.data.top10[i].premarket = pmVal;
          if (pmVal !== null) updatedCount++;
        } else if (STATE.data.top10[i]) {
          STATE.data.top10[i].premarket = null;
        }
      }
    }

    const newGeo = [];
    for (let r = 71; r <= 105; r++) {
      const ctry = lt['B' + r], reg = lt['C' + r], pExp = lt['D' + r], aExp = lt['E' + r];
      if (!ctry || typeof pExp !== 'number') continue;
      newGeo.push({
        country: String(ctry),
        region: String(reg || ''),
        port_exposure: pExp,
        acwi_exposure: Number(aExp || 0),
        active_weight: pExp - Number(aExp || 0)
      });
    }
    if (newGeo.length > 0) STATE.data.geo = newGeo.sort((a, b) => b.port_exposure - a.port_exposure);
  } else if (sheetMap['Dashboard']) {
    const d = sheetMap['Dashboard'];
    if (typeof d['H12'] === 'number') { STATE.data.mandates[0].ytd = d['H12']; updatedCount++; }
    if (typeof d['AD12'] === 'number') { STATE.data.mandates[1].ytd = d['AD12']; updatedCount++; }
    if (typeof d['AS12'] === 'number') { STATE.data.mandates[2].ytd = d['AS12']; updatedCount++; }
    if (typeof d['BF12'] === 'number') { STATE.data.mandates[3].ytd = d['BF12']; updatedCount++; }
    if (typeof d['BO12'] === 'number') { STATE.data.mandates[4].ytd = d['BO12']; updatedCount++; }
    const pe = sheetMap['Port Exposure'] || sheetMap['Port Exposure '];
    if (pe) {
      for (let i = 0; i < 10; i++) {
        const pm = parseOptPct(pe['E' + (56 + i)]);
        if (STATE.data.top10[i]) STATE.data.top10[i].premarket = pm;
      }
    }
  }
  return updatedCount;
}

async function importXlsxFile(file) {
  try {
    const inpTok = document.getElementById('ghTokenInput');
    const typedTok = inpTok && inpTok.value ? inpTok.value.trim() : '';
    if (typedTok) setSavedToken(typedTok);

    STATE.syncTone = 'info';
    STATE.syncStatus = 'Parsing & sanitizing ' + file.name + ' locally in browser...';
    render();

    const ab = await file.arrayBuffer();
    const files = await readXlsxEntries(ab);
    const shared = [];
    if (files['xl/sharedStrings.xml']) {
      const sDoc = new DOMParser().parseFromString(files['xl/sharedStrings.xml'], 'application/xml');
      const si = sDoc.getElementsByTagName('si');
      for (let i = 0; i < si.length; i++) {
        const ts = si[i].getElementsByTagName('t');
        let s = '';
        for (let j = 0; j < ts.length; j++) s += ts[j].textContent;
        shared.push(s);
      }
    }
    const relMap = {};
    if (files['xl/_rels/workbook.xml.rels']) {
      const rDoc = new DOMParser().parseFromString(files['xl/_rels/workbook.xml.rels'], 'application/xml');
      const rels = rDoc.getElementsByTagName('Relationship');
      for (let i = 0; i < rels.length; i++) {
        relMap[rels[i].getAttribute('Id')] = 'xl/' + rels[i].getAttribute('Target').replace(/^\/?xl\//, '');
      }
    }
    const sheetMap = {};
    if (files['xl/workbook.xml']) {
      const wDoc = new DOMParser().parseFromString(files['xl/workbook.xml'], 'application/xml');
      const shs = wDoc.getElementsByTagName('sheet');
      for (let i = 0; i < shs.length; i++) {
        const nm = shs[i].getAttribute('name');
        const rId = shs[i].getAttribute('r:id') || shs[i].getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
        const target = relMap[rId];
        if (target && files[target]) sheetMap[nm.trim()] = parseSheetCells(files[target], shared);
      }
    }

    const updatedCount = syncWorkbookSheets(sheetMap);
    STATE.data.meta.locked_at = sgtNowStr() + ' (' + file.name + ')';
    STATE.locked = true;

    const activeTok = getSavedToken();
    if (activeTok) {
      await publishSnapshotToGitHub(activeTok, file.name);
    } else {
      STATE.pendingPublish = true;
      STATE.syncTone = 'warn';
      STATE.syncStatus = `Parsed ${updatedCount} items locally! Paste your Team Publisher Token above and click "Publish Current Snapshot Live to Everyone Now" so all viewers see this update.`;
      render();
    }
  } catch (err) {
    STATE.syncTone = 'err';
    STATE.syncStatus = 'Error parsing workbook: ' + err.message;
    render();
  }
}

async function exportLockedHtml() {
  if (!STATE.unlocked || !STATE.data || !STATE.passkey) return;
  const sealedCopy = await sealPayload(STATE.data, STATE.passkey);
  let docHtml = document.documentElement.outerHTML;
  docHtml = docHtml.replace(/const INITIAL_SEALED = [\s\S]*?\n(?=\n\/\/ ====|const K256)/, 'const INITIAL_SEALED = ' + JSON.stringify(sealedCopy) + ';\n');
  const blob = new Blob(['<!DOCTYPE html>\n' + docHtml], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'IM_Locked_Meeting_' + (STATE.data.meta.as_of_date || 'Snapshot') + '.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

  }).join('');

  const maxAbs = Math.max(12, ...d.mandates.flatMap(m => [Math.abs(m.ytd * 100), Math.abs(m.bm_ytd * 100)]));
  const perfBars = d.mandates.map(m => {
    const pW = Math.max(1, (Math.abs(m.ytd * 100) / maxAbs) * 100);
    const bW = Math.max(1, (Math.abs(m.bm_ytd * 100) / maxAbs) * 100);
    return `
      <div class="space-y-1">
        <div class="flex justify-between text-xs">
          <span class="font-medium text-[var(--foreground)]">${escHtml(m.name)}</span>
          <span class="font-medium"><span class="text-blue-600 dark:text-blue-400">Port ${fmtPct(m.ytd, 2, true)}</span> <span class="text-[var(--muted-foreground)]">/ BM ${fmtPct(m.bm_ytd, 2, true)}</span></span>
        </div>
        <div class="space-y-1">
          <div class="w-full h-2.5 bg-[var(--secondary)] rounded-full overflow-hidden">
            <div class="h-full rounded-full ${m.ytd >= 0 ? 'bg-blue-600' : 'bg-rose-500'}" style="width:${pW.toFixed(1)}%"></div>
          </div>
          <div class="w-full h-2 bg-[var(--secondary)] rounded-full overflow-hidden">
            <div class="h-full rounded-full bg-slate-400 dark:bg-slate-500" style="width:${bW.toFixed(1)}%"></div>
          </div>
        </div>
      </div>
    `;
  }).join('');

  const stackedRows = d.mandates.map(m => {
    const alloc = computeMandateAlloc(m, false);
    const segs = AC_ORDER.map(ac => {
      const pct = Math.max(0, (alloc[ac] || 0) * 100);
      if (pct < 0.05) return '';
      return `<div style="width:${pct.toFixed(2)}%;background:${AC_COLORS[ac]}" title="${ac}: ${pct.toFixed(2)}%" class="h-full first:rounded-l last:rounded-r"></div>`;
    }).join('');
    return `
      <tr class="border-b border-[var(--border)] hover:bg-[var(--secondary)]/40 text-xs">
        <td class="py-2.5 px-3 font-semibold text-[var(--foreground)] whitespace-nowrap">${escHtml(m.name)}</td>
        <td class="py-2.5 px-3 w-48"><div class="w-44 h-3.5 bg-[var(--secondary)] rounded flex overflow-hidden">${segs}</div></td>
        ${AC_ORDER.map(ac => `<td class="py-2.5 px-2 text-right font-mono ${alloc[ac] > 0.0001 ? 'text-[var(--foreground)]' : 'text-[var(--muted-foreground)]/50'}">${alloc[ac] > 0.0001 ? fmtPct(alloc[ac], 1) : '—'}</td>`).join('')}
        <td class="py-2.5 px-3 text-right font-semibold text-emerald-600 dark:text-emerald-400">${fmtPct(Object.values(alloc).reduce((a,b)=>a+b,0), 1)}</td>
      </tr>
    `;
  }).join('');

  const legend = AC_ORDER.map(ac => `
    <span class="inline-flex items-center gap-1.5 text-xs text-[var(--muted-foreground)]">
      <span class="w-2.5 h-2.5 rounded-sm inline-block" style="background:${AC_COLORS[ac]}"></span>${ac}
    </span>
  `).join('');

  return `
    <div class="space-y-5">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">${cards}</div>
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
        <div class="lg:col-span-5 bg-[var(--card)] border border-[var(--border)] rounded-xl p-4 shadow-sm">
          <div class="flex items-center justify-between mb-3">
            <h3 class="font-semibold text-sm text-[var(--foreground)]">YTD Mandate vs Benchmark</h3>
            <span class="text-xs text-[var(--muted-foreground)]">As of ${escHtml(d.meta.as_of_date)}</span>
          </div>
          <div class="space-y-3.5">${perfBars}</div>
          <div class="mt-4 pt-3 border-t border-[var(--border)] flex flex-wrap justify-between gap-2 text-xs text-[var(--muted-foreground)]">
            <span>S&amp;P 500 YTD: <strong class="text-[var(--foreground)]">${fmtPct(d.macro.spx_ytd, 2, true)}</strong> (Sharpe: ${fmtNum(d.macro.spx_sharpe_ytd, 2)})</span>
            <span>MSCI ACWI Sharpe: <strong class="text-[var(--foreground)]">${fmtNum(d.macro.acwi_sharpe_ytd, 2)}</strong></span>
          </div>
        </div>
        <div class="lg:col-span-7 bg-[var(--card)] border border-[var(--border)] rounded-xl p-4 shadow-sm overflow-x-auto">
          <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
            <div>
              <h3 class="font-semibold text-sm text-[var(--foreground)]">Cross-Mandate Asset Allocation Matrix</h3>
              <p class="text-xs text-[var(--muted-foreground)]">Portfolio weight breakdown across all 5 mandates</p>
            </div>
          </div>
          <div class="flex flex-wrap gap-3 mb-3">${legend}</div>
          <table class="w-full border-collapse">
            <thead>
              <tr class="border-b border-[var(--border)] text-xs text-[var(--muted-foreground)]">
                <th class="py-2 px-3 text-left font-medium">Mandate</th>
                <th class="py-2 px-3 text-left font-medium">Mix</th>
                ${AC_ORDER.map(ac => `<th class="py-2 px-2 text-right font-medium whitespace-nowrap">${ac.replace('EQ: ','').replace('FI: ','')}</th>`).join('')}
                <th class="py-2 px-3 text-right font-medium">Total</th>
              </tr>
            </thead>
            <tbody>${stackedRows}</tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}

function renderPositions() {
  const d = STATE.data;
  const mandate = d.mandates.find(m => m.id === STATE.selectedMandate) || d.mandates[0];
  const isGrowth = mandate.id === 'growth' || mandate.name === 'Growth';
  const activeSortCol = (!isGrowth && STATE.posSortCol === 'premarket') ? 'w' : STATE.posSortCol;

  const pills = d.mandates.map(m => `
    <button onclick="selectMandate('${m.id}')" class="px-3.5 py-1.5 rounded-lg text-xs font-medium transition-colors ${m.id === mandate.id ? 'bg-blue-600 text-white shadow-sm' : 'bg-[var(--secondary)] text-[var(--foreground)] hover:opacity-85'}">
      ${escHtml(m.name)}
    </button>
  `).join('');

  const preAlloc = computeMandateAlloc(mandate, false);
  const postAlloc = computeMandateAlloc(mandate, true);
  const postSum = Object.values(postAlloc).reduce((a, b) => a + b, 0);

  const contribSorted = [...mandate.positions]
    .filter(p => Math.abs(p.c_ytd || 0) > 0.00001)
    .sort((a, b) => b.c_ytd - a.c_ytd);
  const maxC = Math.max(0.007, ...contribSorted.map(p => Math.abs(p.c_ytd)));

  const contribBars = contribSorted.map(p => {
    const pctBar = Math.min(100, (Math.abs(p.c_ytd) / maxC) * 100);
    const pos = p.c_ytd >= 0;
    return `
      <div class="grid grid-cols-12 items-center gap-2 text-xs py-1">
        <div class="col-span-4 truncate font-medium text-[var(--foreground)]" title="${escHtml(p.name)}">${escHtml(p.ref_name || p.name)}</div>
        <div class="col-span-6 flex items-center">
          <div class="w-1/2 flex justify-end pr-1 border-r border-[var(--border)]">
            ${!pos ? `<div class="h-3 bg-rose-500 rounded-l" style="width:${pctBar.toFixed(1)}%"></div>` : ''}
          </div>
          <div class="w-1/2 flex justify-start pl-1">
            ${pos ? `<div class="h-3 bg-emerald-500 rounded-r" style="width:${pctBar.toFixed(1)}%"></div>` : ''}
          </div>
        </div>
        <div class="col-span-2 text-right font-mono font-medium ${colorCls(p.c_ytd)}">${fmtBps(p.c_ytd)}</div>
      </div>
    `;
  }).join('');

  const acSet = ['ALL', ...new Set(mandate.positions.map(p => p.ac))];
  let rows = mandate.positions.map((p, idx) => ({ ...p, _idx: idx }));
  if (STATE.posAcFilter !== 'ALL') rows = rows.filter(p => p.ac === STATE.posAcFilter);
  if (STATE.posSearch.trim()) {
    const q = STATE.posSearch.trim().toLowerCase();
    rows = rows.filter(p => (p.name + ' ' + p.ref_name + ' ' + p.ticker + ' ' + p.sector).toLowerCase().includes(q));
  }
  rows.sort((a, b) => {
    const ha = hasNum(a[activeSortCol]);
    const hb = hasNum(b[activeSortCol]);
    if (!ha && !hb) return 0;
    if (!ha) return 1;
    if (!hb) return -1;
    const va = Number(a[activeSortCol]);
    const vb = Number(b[activeSortCol]);
    return STATE.posSortDir === 'desc' ? (vb - va) : (va - vb);
  });

  const sortHdr = (col, label) => {
    const arrow = activeSortCol === col ? (STATE.posSortDir === 'desc' ? ' &darr;' : ' &uarr;') : '';
    return `<th onclick="sortPositions('${col}')" class="py-2.5 px-2.5 text-right font-medium cursor-pointer hover:text-[var(--foreground)] whitespace-nowrap select-none">${label}${arrow}</th>`;
  };

  const tableRows = rows.map(p => {
    const trKey = mandate.id + ':' + p._idx;
    const trVal = STATE.trades[trKey] || 0;
    const postW = (p.w || 0) + trVal;
    return `
      <tr class="border-b border-[var(--border)] hover:bg-[var(--secondary)]/40 text-xs">
        <td class="py-2.5 px-3">
          <div class="font-semibold text-[var(--foreground)]">${escHtml(p.ref_name || p.name)}</div>
          <div class="text-xs text-[var(--muted-foreground)]">${escHtml(p.ticker)} &bull; ${escHtml(p.sector)} ${p.warn ? `<span class="text-amber-600 dark:text-amber-400 font-medium">(${escHtml(p.warn)})</span>` : ''}</div>
        </td>
        <td class="py-2.5 px-2"><span class="px-2 py-0.5 rounded bg-[var(--secondary)] text-[var(--foreground)] font-medium whitespace-nowrap">${escHtml(p.ac)}</span></td>
        <td class="py-2.5 px-2.5 text-right font-mono font-semibold text-[var(--foreground)]">${fmtPct(p.w)}</td>
        ${!STATE.locked ? `
          <td class="py-2 px-2 text-right">
            <input type="number" step="0.5" value="${(trVal * 100).toFixed(1)}" onchange="updateTrade('${trKey}', this.value)"
              class="w-16 px-1.5 py-1 text-right font-mono text-xs rounded border border-blue-400 bg-[var(--background)] text-[var(--foreground)]" />
          </td>
          <td class="py-2.5 px-2 text-right font-mono font-semibold text-blue-600 dark:text-blue-400">${fmtPct(postW)}</td>
        ` : ''}
        ${isGrowth ? `<td class="py-2.5 px-2.5 text-right font-mono font-medium ${hasNum(p.premarket) ? colorCls(p.premarket) : 'text-[var(--muted-foreground)]/60'}">${fmtPct(p.premarket, 2, true)}</td>` : ''}
        <td class="py-2.5 px-2.5 text-right font-mono ${colorCls(p.d1)}">${fmtPct(p.d1, 2, true)}</td>
        <td class="py-2.5 px-2.5 text-right font-mono ${colorCls(p.d5)}">${fmtPct(p.d5, 2, true)}</td>
        <td class="py-2.5 px-2.5 text-right font-mono font-medium ${colorCls(p.hpr_usd)}">${fmtPct(p.hpr_usd, 2, true)}</td>
        <td class="py-2.5 px-2.5 text-right font-mono ${colorCls(p.ytd_pos)}">${fmtPct(p.ytd_pos, 2, true)}</td>
        <td class="py-2.5 px-2.5 text-right font-mono font-semibold ${colorCls(p.c_ytd)}">${fmtBps(p.c_ytd)}</td>
        <td class="py-2.5 px-2.5 text-right font-mono text-[var(--muted-foreground)]">${p.vol ? fmtPct(p.vol, 1) : '—'}</td>
      </tr>
    `;
  }).join('');

  return `
    <div class="space-y-4">
      <div class="flex flex-wrap items-center justify-between gap-3 bg-[var(--card)] border border-[var(--border)] rounded-xl p-3.5 shadow-sm">
        <div class="flex flex-wrap gap-2">${pills}</div>
        <div class="flex items-center gap-2">
          <button onclick="toggleLock()" class="px-3 py-1.5 rounded-lg text-xs font-semibold border transition-all ${STATE.locked ? 'border-[var(--border)] bg-[var(--secondary)] text-[var(--foreground)]' : 'border-amber-500 bg-amber-500/15 text-amber-700 dark:text-amber-300'}">
            ${STATE.locked ? 'Unlock Trade Sandbox' : 'Sandbox Active (Click to Lock)'}
          </button>
          ${Object.keys(STATE.trades).length ? `<button onclick="resetSandbox()" class="px-2.5 py-1.5 rounded-lg text-xs font-medium bg-rose-500/15 text-rose-600 dark:text-rose-400">Reset Trades</button>` : ''}
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
        <div class="lg:col-span-7 bg-[var(--card)] border border-[var(--border)] rounded-xl p-4 shadow-sm">
          <div class="flex items-center justify-between mb-2">
            <h3 class="font-semibold text-sm text-[var(--foreground)]">${escHtml(mandate.name)} — YTD Contribution Waterfall (bps)</h3>
            <span class="text-xs font-medium ${colorCls(mandate.ytd)}">Total YTD: ${fmtPct(mandate.ytd, 2, true)} (Ex-FCN: ${fmtPct(mandate.ytd_ex_fcn, 2, true)})</span>
          </div>
          <div class="max-h-60 overflow-y-auto pr-1 divide-y divide-[var(--border)]/40">${contribBars}</div>
        </div>

        <div class="lg:col-span-5 bg-[var(--card)] border border-[var(--border)] rounded-xl p-4 shadow-sm">
          <div class="flex items-center justify-between mb-2">
            <h3 class="font-semibold text-sm text-[var(--foreground)]">Pre-Trade vs Post-Trade Exposure</h3>
            <span class="text-xs font-mono ${Math.abs(postSum - 1) < 0.001 ? 'text-emerald-600 dark:text-emerald-400' : 'text-amber-600 dark:text-amber-400'}">Post Sum: ${fmtPct(postSum, 2)}</span>
          </div>
          <p class="text-xs text-[var(--muted-foreground)] mb-2.5">${STATE.locked ? 'Frame is locked for presentation. Click "Unlock Trade Sandbox" above to test rebalance trades.' : 'Enter Trade (+/- %) in table below to simulate post-trade weights cleanly.'}</p>
          <div class="space-y-1.5 text-xs">
            ${AC_ORDER.filter(ac => preAlloc[ac] > 0.0001 || postAlloc[ac] > 0.0001).map(ac => `
              <div class="flex items-center justify-between py-1 border-b border-[var(--border)]/50">
                <span class="font-medium text-[var(--foreground)] flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-sm" style="background:${AC_COLORS[ac]}"></span>${ac}</span>
                <span class="font-mono">
                  <span class="text-[var(--muted-foreground)]">${fmtPct(preAlloc[ac])}</span>
                  <span class="mx-1 text-[var(--muted-foreground)]">&rarr;</span>
                  <strong class="text-[var(--foreground)]">${fmtPct(postAlloc[ac])}</strong>
                </span>
              </div>
            `).join('')}
          </div>
        </div>
      </div>

      <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-4 shadow-sm">
        <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
          <div class="flex flex-wrap items-center gap-2">
            <input type="text" placeholder="Search holding, ticker, sector..." value="${escHtml(STATE.posSearch)}"
              oninput="STATE.posSearch=this.value;render()"
              class="px-3 py-1.5 rounded-lg text-xs border border-[var(--border)] bg-[var(--background)] text-[var(--foreground)] w-56" />
            <select onchange="STATE.posAcFilter=this.value;render()" class="px-2.5 py-1.5 rounded-lg text-xs border border-[var(--border)] bg-[var(--background)] text-[var(--foreground)]">
              ${acSet.map(ac => `<option value="${escHtml(ac)}" ${STATE.posAcFilter === ac ? 'selected' : ''}>${ac === 'ALL' ? 'All Asset Classes' : escHtml(ac)}</option>`).join('')}
            </select>
          </div>
          <div class="text-xs text-[var(--muted-foreground)]">Showing ${rows.length} of ${mandate.positions.length} positions &bull; Click column headers to sort</div>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full border-collapse">
            <thead>
              <tr class="border-b border-[var(--border)] text-xs text-[var(--muted-foreground)]">
                <th class="py-2.5 px-3 text-left font-medium">Position / Ticker</th>
                <th class="py-2.5 px-2 text-left font-medium">Class</th>
                ${sortHdr('w', 'Weight')}
                ${!STATE.locked ? `<th class="py-2.5 px-2 text-right font-medium text-blue-600 dark:text-blue-400">Trade (%)</th><th class="py-2.5 px-2 text-right font-medium text-blue-600 dark:text-blue-400">After Trade</th>` : ''}
                ${isGrowth ? sortHdr('premarket', 'Premarket %') : ''}
                ${sortHdr('d1', '1D %')}
                ${sortHdr('d5', '5D %')}
                ${sortHdr('hpr_usd', 'HPR (USD)')}
                ${sortHdr('ytd_pos', 'Asset YTD')}
                ${sortHdr('c_ytd', 'YTD Contrib')}
                ${sortHdr('vol', '5Y Vol')}
              </tr>
            </thead>
            <tbody>${tableRows}</tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}

function renderLookthrough() {

  const q = STATE.ltSearch.trim().toLowerCase();
  const filteredConst = d.constituents.filter(c => !q || (c.n + ' ' + c.t + ' ' + c.c).toLowerCase().includes(q)).slice(0, 20);
  const totalSearchWeight = q ? d.constituents.filter(c => (c.n + ' ' + c.t).toLowerCase().includes(q)).reduce((s, c) => s + c.w, 0) : null;

  const top10Rows = d.top10.map((item, i) => {

        </td>
        <td class="py-2.5 px-2 text-right font-mono ${colorCls(item.post_earn_1d)}">${fmtPct(item.post_earn_1d, 1, true)}</td>

        <td class="py-2 px-3 font-medium text-[var(--foreground)]">${escHtml(g.country)}</td>
        <td class="py-2 px-2 text-[var(--muted-foreground)]">${escHtml(g.region)}</td>
        <td class="py-2 px-2 text-right font-mono text-[var(--foreground)]">${fmtPct(g.port_exposure, 2)}</td>
        <td class="py-2 px-2 text-right font-mono text-[var(--muted-foreground)]">${fmtPct(g.acwi_exposure, 2)}</td>
        <td class="py-2 px-3 text-right font-mono font-semibold ${colorCls(act)}">${fmtPct(act, 2, true)}</td>

        <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
          <div>
            <h3 class="font-semibold text-sm text-[var(--foreground)]">Top 10 Effective Portfolio Holdings &amp; Earnings Catalyst Monitor</h3>
            <p class="text-xs text-[var(--muted-foreground)]">Multi-class share lines consolidated &bull; Click any holding to inspect sleeve attribution</p>
          </div>

function renderFcns() {
  const d = STATE.data;
  const shocks = { 'SPX Index': STATE.fcnShockSpx / 100, 'NKY Index': STATE.fcnShockNky / 100, 'SX5E Index': STATE.fcnShockSx5e / 100 };

  const noteCards = d.fcns.map(n => {
    const legs = n.underlyings.map(u => {
      const sh = shocks[u.ticker] || 0;
      const simSpot = u.last * (1 + sh);
      const simPctRef = simSpot / u.ref;
      const kiBuf = simPctRef - n.ki_barrier_pct;
      const kiBreachPx = u.ref * n.ki_barrier_pct;
      const dropToKiFromSpot = (kiBreachPx / simSpot) - 1;
      return { ...u, simSpot, simPctRef, kiBuf, kiBreachPx, dropToKiFromSpot };
    });
    const worst = legs.reduce((a, b) => a.simPctRef < b.simPctRef ? a : b);
    const breached = worst.kiBuf <= 0;
    const koTriggered = legs.every(l => l.simPctRef >= n.ko_barrier_pct);

    return `
      <div class="bg-[var(--card)] border ${breached ? 'border-rose-500 ring-1 ring-rose-500/40' : 'border-[var(--border)]'} rounded-xl p-4 shadow-sm space-y-3">
        <div class="flex items-start justify-between gap-2">
          <div>
            <span class="text-xs font-semibold px-2 py-0.5 rounded bg-purple-500/15 text-purple-700 dark:text-purple-300">${escHtml(n.mandate)}</span>
            <h3 class="font-semibold text-base text-[var(--foreground)] mt-1">${escHtml(n.label)}</h3>
            <div class="text-xs text-[var(--muted-foreground)]">Issued ${escHtml(n.issue_date)} &bull; Maturity ${escHtml(n.maturity)}</div>
          </div>
          <div class="text-right">
            <div class="text-lg font-bold text-emerald-600 dark:text-emerald-400">${fmtPct(n.coupon_ann)} <span class="text-xs font-normal text-[var(--muted-foreground)]">p.a.</span></div>
            <div class="text-xs text-[var(--muted-foreground)]">Next Obs: <strong>${n.days_to_obs}d</strong> (${escHtml(n.next_obs)})</div>
          </div>
        </div>

        <div class="grid grid-cols-3 gap-2 p-2.5 rounded-lg bg-[var(--secondary)]/60 text-xs">
          <div><span class="text-[var(--muted-foreground)] block">KI Barrier</span><strong class="text-[var(--foreground)]">${fmtPct(n.ki_barrier_pct, 0)} of Ref</strong></div>
          <div><span class="text-[var(--muted-foreground)] block">Accrued Cpn</span><strong class="text-[var(--foreground)]">${fmtPct(n.accrued_coupon, 2)}</strong></div>
          <div><span class="text-[var(--muted-foreground)] block">YTD Contrib</span><strong class="text-emerald-600 dark:text-emerald-400">${fmtBps(n.ytd_contrib)}</strong></div>
        </div>

        <div class="flex items-center justify-between text-xs px-1">
          <span>Worst-Of: <strong class="text-[var(--foreground)]">${escHtml(worst.name)} (${fmtPct(worst.simPctRef, 1)})</strong></span>
          <span class="px-2 py-0.5 rounded font-semibold ${breached ? 'bg-rose-500/20 text-rose-600 dark:text-rose-300' : koTriggered ? 'bg-blue-500/20 text-blue-600 dark:text-blue-300' : 'bg-emerald-500/15 text-emerald-700 dark:text-emerald-300'}">
            ${breached ? 'KI BREACHED' : koTriggered ? 'AUTOCALL KO (>=100%)' : 'SAFE (+' + (worst.kiBuf*100).toFixed(1) + '% vs KI)'}
          </span>
        </div>

        <div class="space-y-2.5 pt-1">
          ${legs.map(l => {
            const isWorst = l.ticker === worst.ticker;
            const barPos = Math.max(0, Math.min(100, ((l.simPctRef - 0.4) / 0.75) * 100));
            const kiLinePos = ((n.ki_barrier_pct - 0.4) / 0.75) * 100;
            const koLinePos = ((1.0 - 0.4) / 0.75) * 100;
            return `
              <div class="p-2.5 rounded-lg border ${isWorst ? 'border-amber-500/50 bg-amber-500/5' : 'border-[var(--border)]'} text-xs space-y-1.5">
                <div class="flex justify-between">
                  <span class="font-semibold text-[var(--foreground)]">${escHtml(l.name)} ${isWorst ? '<span class="text-amber-600 dark:text-amber-400">(Worst-Of)</span>' : ''}</span>
                  <span class="font-mono"><span class="text-[var(--muted-foreground)]">Ref ${fmtNum(l.ref, 1)} &rarr;</span> <strong>${fmtNum(l.simSpot, 1)}</strong> (${fmtPct(l.simPctRef, 1)})</span>
                </div>
                <div class="relative w-full h-2.5 bg-[var(--secondary)] rounded-full overflow-hidden">
                  <div class="absolute top-0 bottom-0 w-0.5 bg-rose-500 z-10" style="left:${kiLinePos.toFixed(1)}%" title="KI Barrier"></div>
                  <div class="absolute top-0 bottom-0 w-0.5 bg-blue-500 z-10" style="left:${koLinePos.toFixed(1)}%" title="KO 100%"></div>
                  <div class="h-full rounded-full ${l.kiBuf <= 0 ? 'bg-rose-500' : l.kiBuf < 0.15 ? 'bg-amber-500' : 'bg-emerald-500'}" style="width:${barPos.toFixed(1)}%"></div>
                </div>
                <div class="flex justify-between text-[var(--muted-foreground)]">
                  <span>KI Level: <strong class="text-[var(--foreground)] font-mono">${fmtNum(l.kiBreachPx, 0)}</strong></span>
                  <span>Spot Drop to KI: <strong class="text-[var(--foreground)] font-mono">${fmtPct(l.dropToKiFromSpot, 1)}</strong></span>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }).join('');

  return `
    <div class="space-y-4">
      <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-4 shadow-sm">
        <div class="flex flex-wrap items-center justify-between gap-3 mb-3">

        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">

            <div class="flex justify-between mb-1 font-medium"><span>S&amp;P 500${d.fcns[0]?.underlyings?.[0] ? ' (Spot ' + fmtNum(d.fcns[0].underlyings[0].last, 1) + ')' : ''}</span><span class="font-mono ${colorCls(STATE.fcnShockSpx)}">${STATE.fcnShockSpx > 0 ? '+' : ''}${STATE.fcnShockSpx}%</span></div>
            <input type="range" min="-45" max="15" step="1" value="${STATE.fcnShockSpx}" oninput="STATE.fcnShockSpx=Number(this.value);render()" class="w-full accent-blue-600" />
          </div>

async function fetchRemoteEnvelope() {
  const savedTok = getSavedToken();
  if (savedTok || !STATE.repoApiPrivate) {
    const apiUrl = `https://api.github.com/repos/${GH_CONFIG.owner}/${GH_CONFIG.repo}/contents/${GH_CONFIG.path}?ref=${GH_CONFIG.branch}`;
    const headers = {};
    if (savedTok) headers['Authorization'] = 'Bearer ' + savedTok;
    try {
      let res = await fetch(apiUrl, { headers, cache: 'no-cache' });
      if (res.status === 401 && headers['Authorization']) {
        delete headers['Authorization'];
        res = await fetch(apiUrl, { headers, cache: 'no-cache' });
      }
      if ((res.status === 404 || res.status === 403) && !savedTok) {
        STATE.repoApiPrivate = true;
      } else if (res.ok) {
        const etag = res.headers.get('ETag');
        if (etag) STATE.lastEtag = etag;
        const payload = await res.json();
        if (payload && payload.content) {
          if (payload.sha) STATE.lastSha = payload.sha;
          return JSON.parse(base64ToUtf8(payload.content));
        }
      }
    } catch (_) {}
  }

  const urls = [`data/snapshot.json?t=${Date.now()}`, `${GH_CONFIG.liveUrl}${GH_CONFIG.path}?t=${Date.now()}`];
  for (const u of urls) {
    try {
      const r = await fetch(u, { cache: 'no-store' });
      if (r.ok) return await r.json();
    } catch (_) {}
  }
  return null;
}

async function submitPasskey(rawKey) {
  const candidate = String(rawKey ?? '').trim();
  if (!candidate) {
    STATE.unlockError = 'Please enter the access passkey.';
    render();
    return false;
  }
  STATE.unlockBusy = true;
  STATE.unlockError = '';
  render();
  let verifierPassed = false;
  try {
    const decrypted = await unsealPayload(INITIAL_SEALED, candidate);
    verifierPassed = true;
    STATE.passkey = candidate;
    STATE.lastEtag = '';
    STATE.lastSha = '';
    if (decrypted && Array.isArray(decrypted.mandates)) {
      STATE.data = decrypted;
      if (!STATE.expandedLt && decrypted.top10 && decrypted.top10[0]) STATE.expandedLt = decrypted.top10[0].name;
      STATE.unlocked = true;
      STATE.unlockBusy = false;
      STATE.unlockError = '';
      render();
      pollLiveSnapshot(false);
      return true;
    }
    const remoteEnv = await fetchRemoteEnvelope();
    if (!remoteEnv) throw new Error('Snapshot unavailable');
    const remoteData = remoteEnv.sealed ? await unsealPayload(remoteEnv, candidate) : remoteEnv;
    if (!remoteData || !Array.isArray(remoteData.mandates)) throw new Error('Snapshot unavailable');
    STATE.data = remoteData;
    if (!STATE.expandedLt && remoteData.top10 && remoteData.top10[0]) STATE.expandedLt = remoteData.top10[0].name;
    STATE.unlocked = true;
    STATE.unlockBusy = false;
    STATE.unlockError = '';
    STATE.cloudStatus = 'live';
    STATE.lastChecked = sgtNowStr();
    render();
    return true;
  } catch (err) {
    STATE.passkey = '';
    STATE.unlocked = false;
    STATE.unlockBusy = false;
    STATE.unlockError = verifierPassed
      ? ('Passkey verified, but snapshot could not be loaded: ' + (err && err.message ? err.message : 'network error'))
      : 'Incorrect passkey. Access denied.';
    render();
    setTimeout(() => {
      const el = typeof document !== 'undefined' ? document.getElementById('passkeyInput') : null;
      if (el && typeof el.focus === 'function') el.focus();
    }, 30);
    return false;
  }
}

function lockTerminal() {
  STATE.unlocked = false;
  STATE.passkey = '';
  STATE.data = null;
  STATE.trades = {};
  STATE.syncModalOpen = false;
  STATE.unlockError = '';
  render();
}

function renderPasskeyGate() {
  return `
    <div class="min-h-[82vh] flex items-center justify-center p-4">
      <div class="w-full max-w-md bg-[var(--card)] border border-[var(--border)] rounded-2xl p-6 md:p-8 shadow-xl space-y-5">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 rounded-xl bg-blue-600/15 border border-blue-500/30 flex items-center justify-center text-blue-600 dark:text-blue-400 shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
          <div>
            <div class="text-xs font-semibold uppercase tracking-wider text-blue-600 dark:text-blue-400">Encrypted Portal</div>
            <h1 class="text-base font-bold text-[var(--foreground)]">Restricted Access Terminal</h1>
          </div>
        </div>

        <p class="text-xs text-[var(--muted-foreground)] leading-relaxed">
          This portal is protected with client-side cryptographic encryption. Enter your access passkey to unlock.
        </p>

        <form onsubmit="event.preventDefault(); const el=document.getElementById('passkeyInput'); submitPasskey(el ? el.value : '');" class="space-y-3.5">
          <div>
            <label for="passkeyInput" class="block text-xs font-semibold text-[var(--foreground)] mb-1.5">Access Passkey</label>
            <div class="relative flex items-center">
              <input
                id="passkeyInput"
                type="${STATE.showPasskeyText ? 'text' : 'password'}"
                autocomplete="off"
                autofocus
                placeholder="Enter secret passkey..."
                ${STATE.unlockBusy ? 'disabled' : ''}
                class="w-full px-3.5 py-2.5 pr-16 rounded-xl text-sm border ${STATE.unlockError ? 'border-rose-500 focus:ring-rose-500/30' : 'border-[var(--border)] focus:border-blue-500'} bg-[var(--background)] text-[var(--foreground)] font-mono outline-none transition-colors"
              />
              <button
                type="button"
                onclick="const cur=document.getElementById('passkeyInput')?.value||''; STATE.showPasskeyText=!STATE.showPasskeyText; render(); const nxt=document.getElementById('passkeyInput'); if(nxt){nxt.value=cur; nxt.focus();}"
                class="absolute right-2.5 px-2 py-1 rounded text-xs font-medium text-[var(--muted-foreground)] hover:text-[var(--foreground)]"
              >
                ${STATE.showPasskeyText ? 'Hide' : 'Show'}
              </button>
            </div>
          </div>

          ${STATE.unlockError ? `
            <div class="px-3 py-2 rounded-xl bg-rose-500/15 border border-rose-500/30 text-rose-600 dark:text-rose-400 text-xs font-medium">
              ${escHtml(STATE.unlockError)}
            </div>
          ` : ''}

          <button
            type="submit"
            ${STATE.unlockBusy ? 'disabled' : ''}
            class="w-full py-2.5 px-4 rounded-xl text-xs font-semibold bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white shadow-sm transition-colors"
          >
            ${STATE.unlockBusy ? 'Decrypting Portfolio Vault...' : 'Unlock Live Terminal'}
          </button>
        </form>

        <div class="pt-3 border-t border-[var(--border)] flex items-center justify-between text-xs text-[var(--muted-foreground)]">
          <span>PBKDF2-SHA256 &bull; Encrypted at Rest</span>
          <span>Live Auto-Sync</span>
        </div>
      </div>
    </div>
  `;
}

function render() {
  if (!STATE.unlocked || !STATE.data) {
    document.getElementById('app').innerHTML = renderPasskeyGate();
    return;
  }
  const d = STATE.data;
  const tabs = [
    ['overview', 'Executive Overview'],
    ['positions', 'Mandates & Attribution'],
    ['lookthrough', 'Top 10 Look-Through & Geo'],
    ['fcn', 'FCN Barrier Monitor'],
    ['audit', 'Live Cloud & Guide']
  ];

  const volPills = d.vol.map(v => {
    const diff = v.last - v.avg_1y;
    return `
      <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-[var(--secondary)]/70 text-xs whitespace-nowrap">
        <span class="font-medium text-[var(--foreground)]">${escHtml(v.name)}:</span>
        <strong class="font-mono text-[var(--foreground)]">${fmtNum(v.last, 1)}</strong>
        <span class="text-[var(--muted-foreground)]">(1Y: ${fmtNum(v.avg_1y, 1)}, <span class="${diff > 0 ? 'text-amber-600 dark:text-amber-400' : 'text-emerald-600 dark:text-emerald-400'}">${diff > 0 ? '+' : ''}${diff.toFixed(1)}</span>)</span>
      </div>
    `;
  }).join('');

  const liveBadge = STATE.cloudStatus === 'live'
    ? `<button onclick="pollLiveSnapshot(true)" title="Connected to GitHub Live Feed (auto-checks every 10s). Click to check now." class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-blue-500/15 text-blue-700 dark:text-blue-300 border border-blue-500/30"><span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>LIVE FEED &bull; AUTO-SYNC</button>`
    : `<button onclick="pollLiveSnapshot(true)" class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-[var(--secondary)] text-[var(--muted-foreground)] border border-[var(--border)]">Check Live Feed</button>`;

  let bodyHtml = '';
  if (STATE.activeTab === 'overview') bodyHtml = renderOverview();
  else if (STATE.activeTab === 'positions') bodyHtml = renderPositions();
  else if (STATE.activeTab === 'lookthrough') bodyHtml = renderLookthrough();
  else if (STATE.activeTab === 'fcn') bodyHtml = renderFcns();
  else bodyHtml = renderAudit();

  document.getElementById('app').innerHTML = `
    <div class="max-w-[1440px] mx-auto space-y-4">
      ${STATE.liveToast ? `
        <div class="bg-emerald-600 text-white px-4 py-2.5 rounded-xl shadow-md flex items-center justify-between text-xs font-semibold">
          <span>${escHtml(STATE.liveToast)}</span>
          <button onclick="STATE.liveToast='';render()" class="opacity-80 hover:opacity-100">Dismiss</button>
        </div>
      ` : ''}
      <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-4 shadow-sm flex flex-wrap items-center justify-between gap-3">
        <div>
          <div class="flex flex-wrap items-center gap-2">
            <h1 class="text-lg font-bold text-[var(--foreground)]">Investment Management — Portfolio &amp; Attribution Frame</h1>
            <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold ${STATE.locked ? 'bg-emerald-500/15 text-emerald-700 dark:text-emerald-300 border border-emerald-500/30' : 'bg-amber-500/15 text-amber-700 dark:text-amber-300 border border-amber-500/30'}">
              ${STATE.locked ? 'LOCKED SNAPSHOT' : 'SANDBOX UNLOCKED'}
            </span>
            ${liveBadge}
          </div>
          <div class="text-xs text-[var(--muted-foreground)] mt-0.5">
            Snapshot Date: <strong class="text-[var(--foreground)]">${escHtml(d.meta.as_of_date)}</strong> &bull;
            Last Synced: ${escHtml(d.meta.locked_at)}
          </div>
        </div>
        <div class="flex flex-wrap items-center gap-2 print:hidden">
          <button onclick="STATE.syncModalOpen=true;render()" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 text-white hover:bg-blue-700 shadow-sm">
            Upload &amp; Publish Live
          </button>
          <button onclick="exportLockedHtml()" class="px-3 py-1.5 rounded-lg text-xs font-semibold border border-[var(--border)] bg-[var(--secondary)] text-[var(--foreground)] hover:opacity-85">
            Export Locked .HTML
          </button>
          <button onclick="window.print()" class="px-3 py-1.5 rounded-lg text-xs font-medium border border-[var(--border)] bg-[var(--card)] text-[var(--muted-foreground)] hover:text-[var(--foreground)]">
            Print
          </button>
          <button onclick="lockTerminal()" title="Lock screen and require passkey again" class="px-3 py-1.5 rounded-lg text-xs font-semibold border border-rose-500/30 bg-rose-500/10 text-rose-600 dark:text-rose-400 hover:bg-rose-500/20">
            Lock
          </button>
        </div>
      </div>
      <div class="flex items-center gap-2 overflow-x-auto pb-1">${volPills}</div>
      <div class="flex flex-wrap gap-1.5 border-b border-[var(--border)] pb-2 print:hidden">
        ${tabs.map(([id, lbl]) => `
          <button onclick="setTab('${id}')" class="px-3.5 py-2 rounded-lg text-xs font-semibold transition-all ${STATE.activeTab === id ? 'bg-[var(--foreground)] text-[var(--background)] shadow-sm' : 'text-[var(--muted-foreground)] hover:text-[var(--foreground)] hover:bg-[var(--secondary)]'}">
            ${lbl}
          </button>
        `).join('')}
      </div>
      ${bodyHtml}
    </div>
    ${renderSyncModal()}
  `;
}

function bootApp() {
  render();
  setTimeout(() => {
    const el = typeof document !== 'undefined' ? document.getElementById('passkeyInput') : null;
    if (el && typeof el.focus === 'function') el.focus();
  }, 40);
  if (typeof setInterval === 'function') {
    setInterval(() => {
      if (typeof document !== 'undefined' && document.hidden) return;
      if (STATE.unlocked) pollLiveSnapshot(false);
    }, GH_CONFIG.pollMs);
  }
  if (typeof document !== 'undefined' && typeof document.addEventListener === 'function') {
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && STATE.unlocked) pollLiveSnapshot(false);
    });
  }
}

window.addEventListener('DOMContentLoaded', bootApp);

  </script>
</body>
</html>
